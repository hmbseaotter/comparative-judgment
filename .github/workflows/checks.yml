name: checks

# The three toolchain gates are acceptance criteria, and until this file existed
# they were enforced by someone remembering to run three commands. They all
# passed, which was a fact about that day rather than a property of the
# repository.
#
# Two versions on purpose: the project declares `requires-python = ">=3.12"` and
# type-checks against 3.12, while development happens on a newer interpreter. A
# single-version matrix would mean the suite never ran on the version the types
# describe, or never on the one it is actually developed against.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync the locked environment
        # --frozen so a drifted lockfile fails here rather than being silently
        # re-resolved, which would defeat the exact-pin criterion this project
        # asserts in its own test suite.
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Tests
        # --cov because the floor lives in pyproject.toml and coverage is opt-in:
        # pytest without it never loads the plugin, and fail_under becomes
        # configuration nobody runs. Same shape as the type check this workflow
        # already got wrong once, which declared a scope it did not enforce.
        run: uv run --frozen pytest -q --cov=comparative_judgment

      - name: Types
        # As configured in pyproject.toml, which declares files = ["src", "tests"].
        # This ran `--strict src`, so the declared scope and the enforced scope were
        # different and only the narrower one ever ran -- the wider one failed.
        run: uv run --frozen mypy

      - name: Lint
        run: uv run --frozen ruff check

      - name: Format
        run: uv run --frozen ruff format --check

  # C-5 / D15. The interface scanner lives in the harness and runs only in the
  # harness's CI, so a spec edit here that breaks the shared findings interface
  # stays green until that repository next builds -- which may be days, and the
  # build is when both repositories get edited most. D15's Rule called this
  # "judgment, not checkable until it is wired into a hook". This is the hook.
  #
  # Dispatch rather than a checkout of the harness. Running the scanner here
  # would need read access to a private repository and a copy of its tooling
  # pinned in this one; asking the harness to run its own scanner needs neither,
  # and the failure lands beside the other checks that read those two specs.
  notify-harness:
    needs: checks
    # A manual run reaches this job too, which is the only way to exercise the
    # dispatch without pushing a spec change. A mechanism testable only by doing
    # the thing it guards is one nobody tests.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, because the step below diffs everything this push
          # carried, and a push of more than one commit reaches past the two
          # commits this used to fetch (D31, second amendment).
          fetch-depth: 0

      - name: Did this push touch a spec?
        id: specs
        # The scanner reads the two specifications and nothing else, so a
        # code-only push would be asking for a run whose answer cannot have
        # changed. Narrow on purpose: a trigger that fires on everything is one
        # whose failures stop being read.
        #
        # Over the whole push, BEFORE to AFTER, because one run serves every
        # commit a push carries: diffing only the tip let a spec change in an
        # earlier commit through without asking. Where that range cannot be
        # read -- a new branch, a force-push, a previous tip this checkout does
        # not hold -- it asks anyway, because an unneeded scanner run costs one
        # harness build and a skipped one costs the check. The values arrive
        # through env rather than inline, so this script is the same text a
        # test can run.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "A manual run is a deliberate test of the dispatch, so it skips"
            echo "the narrowing below and asks the harness regardless."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif ! git merge-base --is-ancestor "$BEFORE" "$AFTER" 2>/dev/null; then
            echo "The previous tip is not an ancestor of this one, so what the push"
            echo "changed cannot be read, and the harness is asked regardless."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$AFTER" | grep -q '^specs/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask the harness to run its interface scanner
        if: steps.specs.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HARNESS_DISPATCH_TOKEN }}
        # HARNESS_DISPATCH_TOKEN needs Actions: write on
        # hmbseaotter/voice-agent-eval-harness and nothing else. Until it is
        # created this warns rather than fails, so that a missing secret does
        # not turn every spec push red -- but it warns loudly, because a
        # dispatch nobody notices is not wired at all.
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning title=Interface scanner not triggered::HARNESS_DISPATCH_TOKEN"
            echo "::warning::is not set, so the harness was not asked to re-run its"
            echo "::warning::interface scanner. This push changed a spec, and that change"
            echo "::warning::is unchecked against the harness until it next builds."
            exit 0
          fi
          if gh workflow run checks.yml \
               --repo hmbseaotter/voice-agent-eval-harness --ref main; then
            echo "Asked the harness to run its interface scanner."
          else
            echo "::error title=Dispatch refused::HARNESS_DISPATCH_TOKEN is set but the"
            echo "::error::dispatch was refused. The token needs Actions: write on"
            echo "::error::hmbseaotter/voice-agent-eval-harness; a token that can read the"
            echo "::error::repository but not run a workflow fails exactly here."
            exit 1
          fi
