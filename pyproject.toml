[project]
name = "comparative-judgment"
version = "0.1.0"
description = "Assign severity by pairwise comparison, never by picking a number on a scale."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Saso Gale" }]

# Deliberately small. Note what is NOT here and never will be: any language-model
# SDK. This tool's output is the ground truth an LLM judge is later measured
# against, so a model inside it would make the measuring instrument depend on the
# thing being measured. A test asserts the lockfile stays free of one.
dependencies = [
    "numpy==2.5.2",
    "pyyaml==6.0.3",
    "textual==8.2.8",
]

[project.scripts]
cj = "comparative_judgment.cli:main"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.5",
    # Type stubs for an already-declared runtime dependency. Not a new
    # capability: mypy --strict is a specified gate and cannot check a
    # dependency it has no types for.
    "types-PyYAML==6.0.12.20260815",
    # Measures whether the tests reach the code, rather than trusting that they do.
    "pytest-cov==7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comparative_judgment"]

# --- type discipline -------------------------------------------------------
# strict is not decoration here: this package computes rates, thresholds and
# midpoints, and a float slot silently receiving an int breaks fractional maths
# in ways no test asserts directly.
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true
disallow_any_explicit = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# textual ships types, but its plugin surface is loose enough that strict mode
# trips on the framework rather than on our code.
module = ["textual.*"]
ignore_missing_imports = true

# --- lint / format ---------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ANN",      # annotations required
    "PTH",      # prefer pathlib over os.path
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is deliberately NOT in addopts. It would apply the floor below to
# every `-k` subset a developer runs, which fails for the one reason a floor
# should never fail: not enough of the suite ran. CI passes --cov, and a test
# asserts that it does, so the floor is enforced where the whole suite runs.
#
# `-q` is deliberately not in addopts either. CI passes `-q` itself, and pytest
# counts the flag each time it appears: addopts plus the command line is `-qq`,
# and at that verbosity pytest prints no final summary -- so neither a CI log nor
# a local `pytest -q` run said how many tests ran. Found when a coverage run
# reported its floor and nothing reported the count, and a test now reads both
# ends so the flag cannot return on either.
addopts = "--strict-markers"

[tool.coverage.run]
source = ["src/comparative_judgment"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Measured at 98% when this floor was set: 24 uncovered lines of 1166, nine of
# them in the CLI and ten in a terminal UI no human has yet run. The floor sits
# below that on purpose. A gate set at the current figure fails on the next
# unrelated change and then gets lowered by whoever is inconvenienced, which is
# a ratchet running the wrong way; two points is about 23 lines of room.
fail_under = 96
